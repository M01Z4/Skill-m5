<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon-api</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Michroma&display=swap" rel="stylesheet">
</head>

<body>
    <main class="pokemon">
        <section class="pokemon-info">
            <h2 class="name" id="name">bob</h2>
            <div class="types"></div>
        </section>

        <section class="pokemon sprite">
            <img src="" class="pkmnimg" id="img">
        </section>

        <section>
            <h2>Stats</h2>
            <ul id="stats"></ul>
        </section>

        <section>
            <h2>Moves</h2>
            <ul id="moveslist">
            </ul>
        </section>
    </main>
</body>

</html>
